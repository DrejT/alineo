# Control plane dashboard. Run from anywhere:
#   docker compose -f ui/docker-compose.yml up -d --build
#
# Bridge networking with host.docker.internal mapped to the host's IPv4 gateway, the same way
# apps/alineod does it. Do NOT switch this to host networking on a host where `host.docker.internal`
# resolves to ::1: OpenSandbox hands out proxy URLs on that name (its `eip`), and the IPv6 path to
# its published port is dead, so every exec fails with "execd not ready".
#
# Variables:
#   ALINEO_UI_BIND            host address to publish on (default 127.0.0.1). A reverse proxy in
#                             another container, such as Caddy, needs the docker gateway, e.g. 172.18.0.1.
#   ALINEO_UI_PORT            host port (default 4610)
#   OPENSANDBOX_URL           the OpenSandbox server (default http://host.docker.internal:8080)
#   ALINEO_UI_MAX_SANDBOXES   how many sandboxes can exist at once (default 8)
#   NVIDIA_API_KEY            turns on agents (chat and steering). Empty means plain sandboxes only.
#                             The key is passed into each agent's sandbox, so anyone who can open a
#                             sandbox can read it. Use a key you can revoke, and not on an open-signup host.
#   ALINEO_UI_CALLBACK_URL    how an agent's sandbox reaches this server, for the Agents page. Default
#                             http://172.17.0.1:<port>. Untested behind Caddy or on a custom network.
#   ALINEO_UI_MAX_AGENTS      most agents at once, across all users (default 3). Each reserves 1.5 GB.
#   GOOGLE_CLIENT_ID          a Google OAuth client of type "Web application". With GOOGLE_CLIENT_SECRET set
#   GOOGLE_CLIENT_SECRET      too, the login page shows "Continue with Google". Empty turns it off.
#   ALINEO_UI_PUBLIC_URL      the URL a browser uses for the dashboard, e.g. https://app.alineo.tech. Google
#                             redirects to <this>/api/auth/google/callback, which must be an authorized
#                             redirect URI on the OAuth client. Empty: built from the request's forwarded headers.
#   ALINEO_UI_LOG_LEVEL       debug, info, warn or error (default info). debug adds one line per tool call.
#   ALINEO_LOG_LEVEL          the same for the agent SDK's own log (default info).
#   ALINEO_UI_RUN_AGENTS      default most containers per goal (5, and never above the cap above). ALINEO_UI_RUN_KEEP_MINUTES (10) is how
#                             long a finished goal keeps its containers before they are removed.
services:
  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: alineo-ui
    restart: unless-stopped
    ports:
      - "${ALINEO_UI_BIND:-127.0.0.1}:${ALINEO_UI_PORT:-4610}:4610"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4610"
      OPENSANDBOX_URL: ${OPENSANDBOX_URL:-http://host.docker.internal:8080}
      ALINEO_UI_MAX_SANDBOXES: ${ALINEO_UI_MAX_SANDBOXES:-8}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ALINEO_UI_MAX_AGENTS: ${ALINEO_UI_MAX_AGENTS:-3}
      ALINEO_UI_LOG_LEVEL: ${ALINEO_UI_LOG_LEVEL:-info}
      ALINEO_LOG_LEVEL: ${ALINEO_LOG_LEVEL:-info}
      ALINEO_UI_CALLBACK_URL: ${ALINEO_UI_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALINEO_UI_PUBLIC_URL: ${ALINEO_UI_PUBLIC_URL:-}
    # Keep the container log bounded. Each line is one JSON event; the same key events are also in the diag table.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./data:/data
