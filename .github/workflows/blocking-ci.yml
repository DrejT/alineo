name: blocking-ci

# Single entrypoint for every check that blocks a merge. Branch protection
# requires exactly one context — "CI required" — and the `required` job below is
# the version-controlled list of what that stands for, so adding a check is a
# repo change rather than a settings change.
#
# Also runs on pushes to main so the same check family stays grouped in the
# Actions UI.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep these alphabetized and mirrored in `required.needs` below.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  codeql:
    name: codeql
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    # A called workflow can only narrow the caller's token, so the scopes
    # CodeQL needs have to be granted here rather than only inside codeql.yml.
    permissions:
      contents: read
      actions: read
      security-events: write

  required:
    name: CI required
    # Without `always()`, GitHub skips this job when a dependency fails and the
    # required check reports success instead of the failure.
    if: ${{ always() }}
    needs:
      - ci
      - codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
