name: Provider contract

# Runs `tests/contract` against a real OpenSandbox server. It creates real containers and pulls
# images, so it is manual and weekly, not on every pull request. It is how a change to the
# `execd_image` pin, the server image, or sandbox exec/files/snapshot code is checked against a
# live server (the unit tests use fakes, and a fake does not strip a newline the way execd v1.0.22
# did).
#
# Not yet run in CI: the steps below reproduce what was run by hand on a developer machine. Treat
# the first run as the test of this file.

on:
  # Temporary: a workflow that only has `workflow_dispatch` cannot be dispatched until its file is
  # on the default branch. This runs it from the feature branch. Remove it when that lands.
  push:
    branches: [sandbox-adapter]
  workflow_dispatch:
    inputs:
      execd_image:
        description: "execd image to test. Empty uses the pin in packages/cli-shared/src/config.ts"
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * 1"

jobs:
  contract:
    name: OpenSandbox contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Write the server config
        env:
          EXECD_IMAGE: ${{ inputs.execd_image }}
        run: |
          # The same generator `alineo init` uses, so CI tests what a user gets.
          bun -e '
            import { serverConfigContent } from "./packages/cli-shared/src/config.ts";
            let toml = serverConfigContent("http://127.0.0.1:8080");
            const override = process.env.EXECD_IMAGE;
            if (override) toml = toml.replace(/execd_image = ".*"/, `execd_image = "${override}"`);
            await Bun.write("/tmp/opensandbox.toml", toml);
          '
          cat /tmp/opensandbox.toml

      - name: Start OpenSandbox
        run: |
          mkdir -p /tmp/opensandbox-data
          docker run -d --name opensandbox -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e OPENSANDBOX_INSECURE_SERVER=YES \
            -v /tmp/opensandbox.toml:/etc/opensandbox/config.toml:ro \
            -v /tmp/opensandbox-data:/data \
            -v /var/run/docker.sock:/var/run/docker.sock \
            opensandbox/server:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health

      - name: Run the contract
        run: bun run test:contract

      - name: Server log on failure
        if: failure()
        run: docker logs opensandbox | tail -200
