name: Publish alineod image

# Docker-registry counterpart to release.yml's npm publish: builds and pushes the alineod
# image to GHCR whenever apps/alineod or a package its Dockerfile bakes in changes on main.
# Unlike npm packages, alineod's version (apps/alineod/package.json) isn't changeset-bumped
# automatically yet — bump it by hand before merging a change that should ship a new tag.

on:
  push:
    branches:
      - main
    paths:
      - "apps/alineod/**"
      - "packages/agent/**"
      - "packages/core/**"
      - "packages/sdks/typescript/**"
      - "packages/adapters/sqlite/**"
      - ".github/workflows/publish-alineod.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./apps/alineod/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/alineod/Dockerfile
          push: true
          tags: |
            ghcr.io/drejt/alineod:${{ steps.version.outputs.value }}
            ghcr.io/drejt/alineod:latest
