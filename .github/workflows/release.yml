name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Configure npm auth
        # changesets/action v2 no longer writes ~/.npmrc from NPM_TOKEN (v1 did), so after
        # #277 `changeset publish` ran unauthenticated and failed with ENEEDAUTH.
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release PR or Publish
        # v2 reads the packages it published from the CHANGESETS_OUTPUT file the CLI
        # writes, instead of grepping "New tag:" lines out of stdout — which
        # @changesets/cli 3.x no longer prints, so v1 silently created neither git tags
        # nor GitHub releases (0.5.1 et al. published to npm untagged; backfilled by hand).
        uses: changesets/action@v2
        with:
          publish-script: bun run release:publish
          version-script: bun run release:version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
