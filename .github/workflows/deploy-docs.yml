name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "packages/sdks/typescript/CHANGELOG.md"
      - "packages/cli/CHANGELOG.md"

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so fumadocs' last-modified plugin can read each doc file's
          # git commit date (feeds sitemap <lastmod> + per-page TechArticle dateModified).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run build
        working-directory: apps/docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: alineo-docs
          directory: apps/docs/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
