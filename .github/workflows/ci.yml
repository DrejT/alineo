name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Typecheck packages
        run: bun run typecheck

      - name: Typecheck sandbox
        run: bun run typecheck
        working-directory: apps/sandbox

      - name: Typecheck docs MCP
        run: bun run typecheck
        working-directory: apps/docs-mcp

      - name: Typecheck alineod
        run: bun run typecheck
        working-directory: apps/alineod

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Test docs
        run: bun run test
        working-directory: apps/docs

      - name: Test alineod
        run: bun run test
        working-directory: apps/alineod

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check for changeset
        run: bunx changeset status --since origin/main

  # Fan-in so branch protection can require one context instead of naming every
  # job. The list below is what "CI required" stands for, and it lives here
  # rather than in repository settings, where an added job is easy to forget.
  required:
    name: CI required
    # Without always(), GitHub skips this job when a dependency fails and the
    # check reports success instead of the failure.
    if: ${{ always() }}
    needs:
      - check
      - test
      - build
      - changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          # `changeset` deliberately does not run outside pull requests or on
          # the release branch; every other dependency must succeed outright.
          SKIPPABLE: changeset
        run: python3 .github/scripts/check_ci_results.py
